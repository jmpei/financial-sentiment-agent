name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  compile:
    # Dependency-free syntax check across every module — catches breakage in the
    # heavy training/serving scripts (torch, transformers, gradio) without
    # installing them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Byte-compile all Python files
        run: python -m compileall -q .

  test:
    # No OpenAI key in CI: test_agent_wiring.py drives the LangGraph agent with a
    # scripted chat model, so tool routing and error handling still run here;
    # the real-LLM tests and trajectory evals skip cleanly. Only the agent-side
    # dependencies are installed (no torch/transformers needed for these tests).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install agent test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            langchain langchain-openai \
            python-dotenv requests pydantic pytest cachetools "mcp>=1.9,<2"
      - name: Run tests
        run: pytest tests/ -v
      - name: Run trajectory evals (skips without OPENAI_API_KEY)
        run: python -m evals.run_evals
